[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tgaibot"
version = "0.1.0"
description = "Private Telegram assistant with Claude, documents and video frames"
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.42,<2",
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
  "Pillow>=11.3,<13",
  "pypdf>=6.0,<7",
  "defusedxml>=0.7.1,<0.8",
  "markdown-it-py>=4.2,<5",
  "reportlab>=4.4,<5",
  "openpyxl>=3.1.5,<4",
  "ddgs==9.16.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.2,<2"]
calls = ["py-tgcalls==3.0.0", "ntgcalls==3.0.2", "faster-whisper>=1.2,<2"]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1"]

[project.scripts]
tgaibot = "tgaibot.__main__:main"

[tool.setuptools.packages.find]
include = ["tgaibot*"]

[tool.setuptools.package-data]
tgaibot = ["web/*.html", "assets/call-sounds/*/*.pcm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".calls-venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

